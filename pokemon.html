<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 350px;
        }

        .form-container label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
            align-self: flex-start;
        }

        #name-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        #name-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #name-input:focus {
            border-color: #ffcb05;
        }

        .upload-area {
            width: 100%;
            padding: 25px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
            background: rgba(255, 255, 255, 0.05);
        }

        .upload-area:hover {
            border-color: #ffcb05;
            background: rgba(255, 255, 255, 0.1);
        }

        .upload-area.has-image {
            border-color: #78c850;
            background: rgba(120, 200, 80, 0.1);
        }

        .upload-area img {
            max-width: 120px;
            max-height: 120px;
            border-radius: 10px;
            margin-top: 10px;
        }

        #file-input {
            display: none;
        }

        #generate-btn {
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ffcb05, #f0a500);
            color: #2a2a2a;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 203, 5, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #generate-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 203, 5, 0.5);
        }

        #generate-btn:active {
            transform: scale(0.98);
        }

        #generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #bildegenerator-link {
            display: inline-block;
            margin-bottom: 25px;
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            transition: background 0.3s, transform 0.2s;
        }

        #bildegenerator-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .error-message {
            color: #ff6b6b;
            margin-top: 20px;
            font-size: 1rem;
            display: none;
        }

        .error-message.visible {
            display: block;
        }

        .loading-spinner {
            display: none;
            margin-top: 20px;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .loading-spinner.visible {
            display: block;
        }

        /* Pokemon Card */
        .pokemon-card {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.5s ease;
        }

        .pokemon-card.visible {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        canvas {
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            max-width: 100%;
            height: auto;
        }

        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>
    <h1>Pokémon Generator &#x26BE;</h1>

    <a href="https://god-nok.no/bildegenerator.html" id="bildegenerator-link">Bildegenerator</a>

    <div class="form-container">
        <label for="name-input">Skriv navnet ditt</label>
        <input type="text" id="name-input" placeholder="Ditt navn...">

        <label>Last opp bilde av deg selv</label>
        <div class="upload-area" id="upload-area">
            <div id="upload-text">Klikk her eller dra et bilde</div>
            <input type="file" id="file-input" accept="image/*">
        </div>
    </div>

    <button id="generate-btn">Generer Pokémon</button>

    <div class="loading-spinner" id="loading">Henter Pokémon og lager fusjon...</div>
    <div class="error-message" id="error">Skriv inn navn og last opp et bilde!</div>

    <div class="pokemon-card" id="pokemon-card">
        <canvas id="pokemon-canvas" width="400" height="560"></canvas>
        <br>
        <button class="download-btn" id="download-btn">Last ned kortet</button>
    </div>

    <script>
        const nameInput = document.getElementById('name-input');
        const fileInput = document.getElementById('file-input');
        const uploadArea = document.getElementById('upload-area');
        const uploadText = document.getElementById('upload-text');
        const generateBtn = document.getElementById('generate-btn');
        const card = document.getElementById('pokemon-card');
        const canvas = document.getElementById('pokemon-canvas');
        const ctx = canvas.getContext('2d');
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const downloadBtn = document.getElementById('download-btn');

        function roundRect(ctx, x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        let uploadedImage = null;

        // Real Pokémon with their Pokédex IDs, types, and base stats
        const POKEMON_LIST = [
            { id: 1, name: 'Bulbasaur', types: ['Grass', 'Poison'], hp: 45 },
            { id: 4, name: 'Charmander', types: ['Fire'], hp: 39 },
            { id: 7, name: 'Squirtle', types: ['Water'], hp: 44 },
            { id: 25, name: 'Pikachu', types: ['Electric'], hp: 35 },
            { id: 35, name: 'Clefairy', types: ['Fairy'], hp: 70 },
            { id: 37, name: 'Vulpix', types: ['Fire'], hp: 38 },
            { id: 39, name: 'Jigglypuff', types: ['Normal', 'Fairy'], hp: 115 },
            { id: 52, name: 'Meowth', types: ['Normal'], hp: 40 },
            { id: 54, name: 'Psyduck', types: ['Water'], hp: 50 },
            { id: 58, name: 'Growlithe', types: ['Fire'], hp: 55 },
            { id: 63, name: 'Abra', types: ['Psychic'], hp: 25 },
            { id: 66, name: 'Machop', types: ['Fighting'], hp: 70 },
            { id: 74, name: 'Geodude', types: ['Rock', 'Ground'], hp: 40 },
            { id: 77, name: 'Ponyta', types: ['Fire'], hp: 50 },
            { id: 92, name: 'Gastly', types: ['Ghost', 'Poison'], hp: 30 },
            { id: 104, name: 'Cubone', types: ['Ground'], hp: 50 },
            { id: 116, name: 'Horsea', types: ['Water'], hp: 30 },
            { id: 120, name: 'Staryu', types: ['Water'], hp: 30 },
            { id: 129, name: 'Magikarp', types: ['Water'], hp: 20 },
            { id: 133, name: 'Eevee', types: ['Normal'], hp: 55 },
            { id: 143, name: 'Snorlax', types: ['Normal'], hp: 160 },
            { id: 147, name: 'Dratini', types: ['Dragon'], hp: 41 },
            { id: 150, name: 'Mewtwo', types: ['Psychic'], hp: 106 },
            { id: 152, name: 'Chikorita', types: ['Grass'], hp: 45 },
            { id: 155, name: 'Cyndaquil', types: ['Fire'], hp: 39 },
            { id: 158, name: 'Totodile', types: ['Water'], hp: 50 },
            { id: 172, name: 'Pichu', types: ['Electric'], hp: 20 },
            { id: 175, name: 'Togepi', types: ['Fairy'], hp: 35 },
            { id: 179, name: 'Mareep', types: ['Electric'], hp: 55 },
            { id: 196, name: 'Espeon', types: ['Psychic'], hp: 65 },
            { id: 197, name: 'Umbreon', types: ['Dark'], hp: 95 },
            { id: 246, name: 'Larvitar', types: ['Rock', 'Ground'], hp: 50 },
            { id: 252, name: 'Treecko', types: ['Grass'], hp: 40 },
            { id: 255, name: 'Torchic', types: ['Fire'], hp: 45 },
            { id: 258, name: 'Mudkip', types: ['Water'], hp: 50 },
            { id: 280, name: 'Ralts', types: ['Psychic', 'Fairy'], hp: 28 },
            { id: 302, name: 'Sableye', types: ['Dark', 'Ghost'], hp: 50 },
            { id: 304, name: 'Aron', types: ['Steel', 'Rock'], hp: 50 },
            { id: 333, name: 'Swablu', types: ['Normal', 'Flying'], hp: 45 },
            { id: 349, name: 'Feebas', types: ['Water'], hp: 20 },
            { id: 363, name: 'Spheal', types: ['Ice', 'Water'], hp: 70 },
            { id: 387, name: 'Turtwig', types: ['Grass'], hp: 55 },
            { id: 390, name: 'Chimchar', types: ['Fire'], hp: 44 },
            { id: 393, name: 'Piplup', types: ['Water'], hp: 53 },
            { id: 403, name: 'Shinx', types: ['Electric'], hp: 45 },
            { id: 427, name: 'Buneary', types: ['Normal'], hp: 55 },
            { id: 443, name: 'Gible', types: ['Dragon', 'Ground'], hp: 58 },
            { id: 447, name: 'Riolu', types: ['Fighting'], hp: 40 },
            { id: 495, name: 'Snivy', types: ['Grass'], hp: 45 },
            { id: 498, name: 'Tepig', types: ['Fire'], hp: 65 },
            { id: 501, name: 'Oshawott', types: ['Water'], hp: 55 },
            { id: 532, name: 'Timburr', types: ['Fighting'], hp: 75 },
            { id: 559, name: 'Scraggy', types: ['Dark', 'Fighting'], hp: 50 },
            { id: 570, name: 'Zorua', types: ['Dark'], hp: 40 },
            { id: 607, name: 'Litwick', types: ['Ghost', 'Fire'], hp: 50 },
            { id: 613, name: 'Cubchoo', types: ['Ice'], hp: 55 },
            { id: 633, name: 'Deino', types: ['Dark', 'Dragon'], hp: 52 },
            { id: 650, name: 'Chespin', types: ['Grass'], hp: 56 },
            { id: 653, name: 'Fennekin', types: ['Fire'], hp: 40 },
            { id: 656, name: 'Froakie', types: ['Water'], hp: 41 },
        ];

        const TYPE_COLORS = {
            'Normal':   { color: '#a8a878', bg: '#c0c0a0' },
            'Fire':     { color: '#f08030', bg: '#f8a060' },
            'Water':    { color: '#6890f0', bg: '#88b0f8' },
            'Grass':    { color: '#78c850', bg: '#a0d878' },
            'Electric': { color: '#f8d030', bg: '#f8e870' },
            'Psychic':  { color: '#f85888', bg: '#f890a8' },
            'Ice':      { color: '#98d8d8', bg: '#b8e8e8' },
            'Dragon':   { color: '#7038f8', bg: '#9868f8' },
            'Dark':     { color: '#705848', bg: '#988070' },
            'Fairy':    { color: '#ee99ac', bg: '#f0b8c8' },
            'Fighting': { color: '#c03028', bg: '#d06058' },
            'Poison':   { color: '#a040a0', bg: '#c068c0' },
            'Ghost':    { color: '#705898', bg: '#9880b8' },
            'Steel':    { color: '#b8b8d0', bg: '#d0d0e0' },
            'Flying':   { color: '#a890f0', bg: '#c0b0f8' },
            'Bug':      { color: '#a8b820', bg: '#c0d050' },
            'Rock':     { color: '#b8a038', bg: '#d0c060' },
            'Ground':   { color: '#e0c068', bg: '#e8d890' },
        };

        // Upload handlers
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#ffcb05';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = uploadedImage ? '#78c850' : 'rgba(255,255,255,0.3)';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    uploadedImage = img;
                    uploadArea.classList.add('has-image');
                    uploadText.innerHTML = `<img src="${e.target.result}" alt="Opplastet bilde"><br><small>Klikk for å bytte bilde</small>`;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function seededRandom(seed) {
            let h = 0;
            for (let i = 0; i < seed.length; i++) {
                h = ((h << 5) - h + seed.charCodeAt(i)) | 0;
            }
            return function() {
                h = (h * 16807 + 0) % 2147483647;
                return (h & 0x7fffffff) / 2147483647;
            };
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('Kunne ikke laste Pokémon-bilde'));
                img.src = src;
            });
        }

        function getPokemonSpriteUrl(id) {
            return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
        }

        async function drawCard(playerName) {
            const rng = seededRandom(playerName.toLowerCase());

            // Pick a Pokémon based on name
            const pokemon = POKEMON_LIST[Math.floor(rng() * POKEMON_LIST.length)];
            const type1 = TYPE_COLORS[pokemon.types[0]];
            const type2 = pokemon.types[1] ? TYPE_COLORS[pokemon.types[1]] : null;

            // Fetch the Pokémon sprite
            const spriteUrl = getPokemonSpriteUrl(pokemon.id);
            const spriteImg = await loadImage(spriteUrl);

            const hp = pokemon.hp + Math.floor(rng() * 50);

            const w = canvas.width;
            const h = canvas.height;

            // Clear
            ctx.clearRect(0, 0, w, h);

            // Card background
            const grad = ctx.createLinearGradient(0, 0, w, h);
            grad.addColorStop(0, type1.bg);
            grad.addColorStop(1, type1.color);
            ctx.fillStyle = grad;
            roundRect(ctx, 0, 0, w, h, 15);
            ctx.fill();

            // Inner card
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            roundRect(ctx, 12, 12, w - 24, h - 24, 10);
            ctx.fill();

            // Header: Pokémon name + HP
            ctx.fillStyle = '#333';
            ctx.font = 'bold 22px "Segoe UI", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(pokemon.name, 25, 45);

            ctx.fillStyle = '#e63946';
            ctx.font = 'bold 18px "Segoe UI", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`${hp} HP`, w - 25, 45);

            // Type badges
            ctx.textAlign = 'right';
            let typeX = w - 25;
            if (type2) {
                ctx.fillStyle = TYPE_COLORS[pokemon.types[1]].color;
                roundRect(ctx, typeX - 60, 52, 60, 22, 11);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(pokemon.types[1], typeX - 30, 67);
                typeX -= 68;
            }
            ctx.fillStyle = type1.color;
            roundRect(ctx, typeX - 60, 52, 60, 22, 11);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 11px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(pokemon.types[0], typeX - 30, 67);

            // Image area
            const imgAreaY = 82;
            const imgAreaH = 220;
            const imgGrad = ctx.createLinearGradient(25, imgAreaY, 25, imgAreaY + imgAreaH);
            imgGrad.addColorStop(0, type1.bg + '60');
            imgGrad.addColorStop(1, type1.color + '30');
            ctx.fillStyle = imgGrad;
            roundRect(ctx, 25, imgAreaY, w - 50, imgAreaH, 8);
            ctx.fill();
            ctx.strokeStyle = type1.color + '80';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw fusion image: user photo + Pokémon sprite combined
            const areaX = 25;
            const areaW = w - 50;

            ctx.save();
            roundRect(ctx, areaX, imgAreaY, areaW, imgAreaH, 8);
            ctx.clip();

            if (uploadedImage) {
                // Draw user photo filling the area (cover fit)
                const userAspect = uploadedImage.width / uploadedImage.height;
                const areaAspect = areaW / imgAreaH;
                let sx, sy, sw, sh;
                if (userAspect > areaAspect) {
                    sh = uploadedImage.height;
                    sw = sh * areaAspect;
                    sx = (uploadedImage.width - sw) / 2;
                    sy = 0;
                } else {
                    sw = uploadedImage.width;
                    sh = sw / areaAspect;
                    sx = 0;
                    sy = (uploadedImage.height - sh) / 2;
                }
                ctx.globalAlpha = 0.55;
                ctx.drawImage(uploadedImage, sx, sy, sw, sh, areaX, imgAreaY, areaW, imgAreaH);
                ctx.globalAlpha = 1.0;

                // Type-colored overlay for blend effect
                ctx.fillStyle = type1.color + '40';
                ctx.fillRect(areaX, imgAreaY, areaW, imgAreaH);
            }

            // Draw Pokémon sprite on top
            const spriteMaxH = uploadedImage ? imgAreaH - 10 : imgAreaH - 20;
            const spriteMaxW = uploadedImage ? areaW * 0.7 : areaW - 40;
            let spriteW = spriteImg.width;
            let spriteH = spriteImg.height;
            const spriteScale = Math.min(spriteMaxW / spriteW, spriteMaxH / spriteH);
            spriteW *= spriteScale;
            spriteH *= spriteScale;
            const spriteX = areaX + (areaW - spriteW) / 2;
            const spriteY = imgAreaY + (imgAreaH - spriteH) / 2;

            if (uploadedImage) {
                // With a photo: Pokémon is semi-transparent to create fusion
                ctx.globalAlpha = 0.75;
            }
            ctx.drawImage(spriteImg, spriteX, spriteY, spriteW, spriteH);
            ctx.globalAlpha = 1.0;

            ctx.restore();

            // Pokédex number
            ctx.fillStyle = '#999';
            ctx.font = '12px "Segoe UI", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`No. ${String(pokemon.id).padStart(4, '0')}`, 25, imgAreaY + imgAreaH + 20);

            // Trainer info
            ctx.fillStyle = '#666';
            ctx.font = '13px "Segoe UI", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`Trener: ${playerName}`, 25, imgAreaY + imgAreaH + 40);

            // Fusion label
            ctx.fillStyle = type1.color;
            ctx.font = 'italic 12px "Segoe UI", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`${playerName} × ${pokemon.name} Fusjon`, w - 25, imgAreaY + imgAreaH + 20);

            // Stats
            const statsY = imgAreaY + imgAreaH + 55;
            const statNames = ['Angrep', 'Forsvar', 'Hastighet', 'Spesial', 'Utholdenhet'];
            const barMaxW = w - 160;

            statNames.forEach((name, i) => {
                const val = Math.floor(rng() * 90) + 30;
                const y = statsY + i * 28;

                ctx.fillStyle = '#555';
                ctx.font = '13px "Segoe UI", sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(name, 25, y + 14);

                ctx.fillStyle = '#eee';
                roundRect(ctx, 110, y + 4, barMaxW, 12, 6);
                ctx.fill();

                const pct = val / 120;
                const barGrad = ctx.createLinearGradient(110, 0, 110 + barMaxW * pct, 0);
                barGrad.addColorStop(0, type1.color);
                barGrad.addColorStop(1, type1.bg);
                ctx.fillStyle = barGrad;
                roundRect(ctx, 110, y + 4, Math.max(barMaxW * pct, 1), 12, 6);
                ctx.fill();

                ctx.fillStyle = '#333';
                ctx.font = 'bold 13px "Segoe UI", sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(val, w - 25, y + 15);
            });
        }

        generateBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            if (!name || !uploadedImage) {
                errorEl.textContent = !name
                    ? 'Skriv inn navnet ditt!'
                    : 'Last opp et bilde av deg selv!';
                errorEl.classList.add('visible');
                card.classList.remove('visible');
                return;
            }

            errorEl.classList.remove('visible');
            card.classList.remove('visible');
            loadingEl.classList.add('visible');
            generateBtn.disabled = true;

            try {
                await drawCard(name);
                loadingEl.classList.remove('visible');
                card.classList.add('visible');
            } catch (err) {
                loadingEl.classList.remove('visible');
                errorEl.textContent = 'Feil ved generering: ' + err.message;
                errorEl.classList.add('visible');
                console.error('Pokemon card error:', err);
            }
            generateBtn.disabled = false;
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'pokemon-fusjon.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
