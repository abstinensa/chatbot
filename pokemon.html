<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 350px;
        }

        .form-container label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
            align-self: flex-start;
        }

        #name-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        #name-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #name-input:focus {
            border-color: #ffcb05;
        }

        .upload-area {
            width: 100%;
            padding: 25px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
            background: rgba(255, 255, 255, 0.05);
        }

        .upload-area:hover {
            border-color: #ffcb05;
            background: rgba(255, 255, 255, 0.1);
        }

        .upload-area.has-image {
            border-color: #78c850;
            background: rgba(120, 200, 80, 0.1);
        }

        .upload-area img {
            max-width: 120px;
            max-height: 120px;
            border-radius: 10px;
            margin-top: 10px;
        }

        #file-input {
            display: none;
        }

        #generate-btn {
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ffcb05, #f0a500);
            color: #2a2a2a;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 203, 5, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #generate-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 203, 5, 0.5);
        }

        #generate-btn:active {
            transform: scale(0.98);
        }

        #generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #bildegenerator-link {
            display: inline-block;
            margin-bottom: 25px;
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            transition: background 0.3s, transform 0.2s;
        }

        #bildegenerator-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .error-message {
            color: #ff6b6b;
            margin-top: 20px;
            font-size: 1rem;
            display: none;
        }

        .error-message.visible {
            display: block;
        }

        .loading-spinner {
            display: none;
            margin-top: 20px;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .loading-spinner.visible {
            display: block;
        }

        /* Pokemon Card */
        .pokemon-card {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.5s ease;
        }

        .pokemon-card.visible {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        canvas {
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            max-width: 100%;
            height: auto;
        }

        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>
    <h1>Pokémon Generator &#x26BE;</h1>

    <a href="https://god-nok.no/bildegenerator.html" id="bildegenerator-link">Bildegenerator</a>

    <div class="form-container">
        <label for="name-input">Skriv navnet ditt</label>
        <input type="text" id="name-input" placeholder="Ditt navn...">

        <label>Last opp bilde</label>
        <div class="upload-area" id="upload-area">
            <div id="upload-text">Klikk her eller dra et bilde</div>
            <input type="file" id="file-input" accept="image/*">
        </div>
    </div>

    <button id="generate-btn">Generer Pokémon</button>

    <div class="loading-spinner" id="loading">Genererer Pokémon-kort...</div>
    <div class="error-message" id="error">Skriv inn navnet ditt først!</div>

    <div class="pokemon-card" id="pokemon-card">
        <canvas id="pokemon-canvas" width="400" height="560"></canvas>
        <br>
        <button class="download-btn" id="download-btn">Last ned kortet</button>
    </div>

    <script>
        const nameInput = document.getElementById('name-input');
        const fileInput = document.getElementById('file-input');
        const uploadArea = document.getElementById('upload-area');
        const uploadText = document.getElementById('upload-text');
        const generateBtn = document.getElementById('generate-btn');
        const card = document.getElementById('pokemon-card');
        const canvas = document.getElementById('pokemon-canvas');
        const ctx = canvas.getContext('2d');
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const downloadBtn = document.getElementById('download-btn');

        // Polyfill for roundRect (not supported in all browsers)
        function roundRect(ctx, x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        let uploadedImage = null;

        const POKEMON_TYPES = [
            { name: 'Fire', color: '#f08030', bg: '#f8a060' },
            { name: 'Water', color: '#6890f0', bg: '#88b0f8' },
            { name: 'Grass', color: '#78c850', bg: '#a0d878' },
            { name: 'Electric', color: '#f8d030', bg: '#f8e870' },
            { name: 'Psychic', color: '#f85888', bg: '#f890a8' },
            { name: 'Ice', color: '#98d8d8', bg: '#b8e8e8' },
            { name: 'Dragon', color: '#7038f8', bg: '#9868f8' },
            { name: 'Dark', color: '#705848', bg: '#988070' },
            { name: 'Fairy', color: '#ee99ac', bg: '#f0b8c8' },
            { name: 'Fighting', color: '#c03028', bg: '#d06058' },
            { name: 'Poison', color: '#a040a0', bg: '#c068c0' },
            { name: 'Ghost', color: '#705898', bg: '#9880b8' },
            { name: 'Steel', color: '#b8b8d0', bg: '#d0d0e0' },
            { name: 'Flying', color: '#a890f0', bg: '#c0b0f8' },
            { name: 'Bug', color: '#a8b820', bg: '#c0d050' },
            { name: 'Rock', color: '#b8a038', bg: '#d0c060' },
            { name: 'Ground', color: '#e0c068', bg: '#e8d890' },
            { name: 'Normal', color: '#a8a878', bg: '#c0c0a0' },
        ];

        const POKEMON_SUFFIXES = [
            'zard', 'saur', 'tle', 'chu', 'dge', 'eon', 'ix', 'bat',
            'puff', 'toise', 'drill', 'bell', 'dot', 'lax', 'mew',
            'tar', 'ran', 'don', 'nite', 'gon', 'gar', 'star', 'king',
            'duck', 'ape', 'fox', 'owl', 'wolf', 'fang', 'claw'
        ];

        // Upload handlers
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#ffcb05';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = uploadedImage ? '#78c850' : 'rgba(255,255,255,0.3)';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    uploadedImage = img;
                    uploadArea.classList.add('has-image');
                    uploadText.innerHTML = `<img src="${e.target.result}" alt="Opplastet bilde"><br><small>Klikk for å bytte bilde</small>`;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function seededRandom(seed) {
            let h = 0;
            for (let i = 0; i < seed.length; i++) {
                h = ((h << 5) - h + seed.charCodeAt(i)) | 0;
            }
            return function() {
                h = (h * 16807 + 0) % 2147483647;
                return (h & 0x7fffffff) / 2147483647;
            };
        }

        function generatePokemonName(playerName, rng) {
            const prefix = playerName.substring(0, Math.min(3, playerName.length)).toLowerCase();
            const suffix = POKEMON_SUFFIXES[Math.floor(rng() * POKEMON_SUFFIXES.length)];
            return prefix.charAt(0).toUpperCase() + prefix.slice(1) + suffix;
        }

        function drawCard(playerName) {
            const rng = seededRandom(playerName + Date.now());
            const type1 = POKEMON_TYPES[Math.floor(rng() * POKEMON_TYPES.length)];
            let type2 = null;
            if (rng() > 0.5) {
                type2 = POKEMON_TYPES[Math.floor(rng() * POKEMON_TYPES.length)];
                if (type2.name === type1.name) type2 = null;
            }

            const pokemonName = generatePokemonName(playerName, rng);
            const hp = Math.floor(rng() * 200) + 50;
            const pokedexNum = Math.floor(rng() * 900) + 100;

            const w = canvas.width;
            const h = canvas.height;

            // Card background
            const grad = ctx.createLinearGradient(0, 0, w, h);
            grad.addColorStop(0, type1.bg);
            grad.addColorStop(1, type1.color);
            ctx.fillStyle = grad;
            roundRect(ctx, 0, 0, w, h, 15);
            ctx.fill();

            // Inner card
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            roundRect(ctx, 12, 12, w - 24, h - 24, 10);
            ctx.fill();

            // Header: name + HP
            ctx.fillStyle = '#333';
            ctx.font = 'bold 22px "Segoe UI", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(pokemonName, 25, 45);

            ctx.fillStyle = '#e63946';
            ctx.font = 'bold 18px "Segoe UI", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`${hp} HP`, w - 25, 45);

            // Type badges
            ctx.textAlign = 'right';
            let typeX = w - 25;
            if (type2) {
                ctx.fillStyle = type2.color;
                roundRect(ctx, typeX - 60, 52, 60, 22, 11);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(type2.name, typeX - 30, 67);
                typeX -= 68;
            }
            ctx.fillStyle = type1.color;
            roundRect(ctx, typeX - 60, 52, 60, 22, 11);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 11px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(type1.name, typeX - 30, 67);

            // Image area
            const imgAreaY = 82;
            const imgAreaH = 220;
            const imgGrad = ctx.createLinearGradient(25, imgAreaY, 25, imgAreaY + imgAreaH);
            imgGrad.addColorStop(0, type1.bg + '60');
            imgGrad.addColorStop(1, type1.color + '30');
            ctx.fillStyle = imgGrad;
            roundRect(ctx, 25, imgAreaY, w - 50, imgAreaH, 8);
            ctx.fill();
            ctx.strokeStyle = type1.color + '80';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw uploaded image or placeholder
            if (uploadedImage) {
                const maxW = w - 70;
                const maxH = imgAreaH - 20;
                let imgW = uploadedImage.width;
                let imgH = uploadedImage.height;
                const scale = Math.min(maxW / imgW, maxH / imgH);
                imgW *= scale;
                imgH *= scale;
                const imgX = (w - imgW) / 2;
                const imgY = imgAreaY + (imgAreaH - imgH) / 2;

                ctx.save();
                roundRect(ctx, imgX, imgY, imgW, imgH, 6);
                ctx.clip();
                ctx.drawImage(uploadedImage, imgX, imgY, imgW, imgH);
                ctx.restore();
            } else {
                // Placeholder: draw a pokeball silhouette
                const cx = w / 2;
                const cy = imgAreaY + imgAreaH / 2;
                const radius = 60;
                ctx.fillStyle = type1.color;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, Math.PI, 0);
                ctx.fill();
                ctx.fillStyle = '#ddd';
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(cx, cy, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(cx, cy, 18, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx - radius, cy);
                ctx.lineTo(cx + radius, cy);
                ctx.stroke();
            }

            // Pokédex number
            ctx.fillStyle = '#999';
            ctx.font = '12px "Segoe UI", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`No. ${String(pokedexNum).padStart(4, '0')}`, 25, imgAreaY + imgAreaH + 20);

            // Trainer info
            ctx.fillStyle = '#666';
            ctx.font = '13px "Segoe UI", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`Trener: ${playerName}`, 25, imgAreaY + imgAreaH + 40);

            // Stats
            const statsY = imgAreaY + imgAreaH + 60;
            const statNames = ['Angrep', 'Forsvar', 'Hastighet', 'Spesial', 'Utholdenhet'];
            const barMaxW = w - 160;

            statNames.forEach((name, i) => {
                const val = Math.floor(rng() * 90) + 30;
                const y = statsY + i * 28;

                ctx.fillStyle = '#555';
                ctx.font = '13px "Segoe UI", sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(name, 25, y + 14);

                // Bar background
                ctx.fillStyle = '#eee';
                roundRect(ctx, 110, y + 4, barMaxW, 12, 6);
                ctx.fill();

                // Bar fill
                const pct = val / 120;
                const barGrad = ctx.createLinearGradient(110, 0, 110 + barMaxW * pct, 0);
                barGrad.addColorStop(0, type1.color);
                barGrad.addColorStop(1, type1.bg);
                ctx.fillStyle = barGrad;
                roundRect(ctx, 110, y + 4, Math.max(barMaxW * pct, 1), 12, 6);
                ctx.fill();

                // Value
                ctx.fillStyle = '#333';
                ctx.font = 'bold 13px "Segoe UI", sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(val, w - 25, y + 15);
            });
        }

        generateBtn.addEventListener('click', () => {
            const name = nameInput.value.trim();
            if (!name) {
                errorEl.textContent = 'Skriv inn navnet ditt først!';
                errorEl.classList.add('visible');
                card.classList.remove('visible');
                return;
            }

            errorEl.classList.remove('visible');
            card.classList.remove('visible');
            loadingEl.classList.add('visible');
            generateBtn.disabled = true;

            setTimeout(() => {
                try {
                    drawCard(name);
                    loadingEl.classList.remove('visible');
                    card.classList.add('visible');
                } catch (err) {
                    loadingEl.classList.remove('visible');
                    errorEl.textContent = 'Feil ved generering: ' + err.message;
                    errorEl.classList.add('visible');
                    console.error('Pokemon card error:', err);
                }
                generateBtn.disabled = false;
            }, 500);
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'mitt-pokemon-kort.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
