<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .pokeball-icon {
            display: inline-block;
            margin-left: 8px;
        }

        #generate-btn {
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ffcb05, #f0a500);
            color: #2a2a2a;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 203, 5, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #generate-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 203, 5, 0.5);
        }

        #generate-btn:active {
            transform: scale(0.98);
        }

        #generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .pokemon-card {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            margin-top: 30px;
            text-align: center;
            min-width: 280px;
            max-width: 350px;
            animation: fadeIn 0.5s ease;
        }

        .pokemon-card.visible {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pokemon-card img {
            width: 180px;
            height: 180px;
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.3));
        }

        .pokemon-card .pokemon-id {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .pokemon-card .pokemon-name {
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: capitalize;
            margin-bottom: 12px;
        }

        .types {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .type-badge {
            padding: 5px 14px;
            border-radius: 15px;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .type-normal { background: #a8a878; }
        .type-fire { background: #f08030; }
        .type-water { background: #6890f0; }
        .type-electric { background: #f8d030; color: #333; }
        .type-grass { background: #78c850; }
        .type-ice { background: #98d8d8; color: #333; }
        .type-fighting { background: #c03028; }
        .type-poison { background: #a040a0; }
        .type-ground { background: #e0c068; color: #333; }
        .type-flying { background: #a890f0; }
        .type-psychic { background: #f85888; }
        .type-bug { background: #a8b820; }
        .type-rock { background: #b8a038; }
        .type-ghost { background: #705898; }
        .type-dragon { background: #7038f8; }
        .type-dark { background: #705848; }
        .type-steel { background: #b8b8d0; color: #333; }
        .type-fairy { background: #ee99ac; }

        .stats {
            margin-top: 15px;
            text-align: left;
        }

        .stat-row {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }

        .stat-name {
            width: 110px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            text-transform: capitalize;
        }

        .stat-bar-bg {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            overflow: hidden;
        }

        .stat-bar {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #ffcb05, #f0a500);
            transition: width 0.6s ease;
        }

        .stat-value {
            width: 30px;
            text-align: right;
            font-size: 0.8rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.9);
        }

        .details {
            display: flex;
            justify-content: center;
            gap: 25px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .error-message {
            color: #ff6b6b;
            margin-top: 20px;
            font-size: 1rem;
            display: none;
        }

        .error-message.visible {
            display: block;
        }

        .loading-spinner {
            display: none;
            margin-top: 20px;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .loading-spinner.visible {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Pokémon Generator <span class="pokeball-icon">&#x26BE;</span></h1>

    <button id="generate-btn">Generer Pokémon</button>

    <div class="loading-spinner" id="loading">Henter Pokémon...</div>
    <div class="error-message" id="error">Noe gikk galt. Prøv igjen!</div>

    <div class="pokemon-card" id="pokemon-card">
        <img id="pokemon-img" src="" alt="">
        <div class="pokemon-id" id="pokemon-id"></div>
        <div class="pokemon-name" id="pokemon-name"></div>
        <div class="types" id="pokemon-types"></div>
        <div class="details" id="pokemon-details"></div>
        <div class="stats" id="pokemon-stats"></div>
    </div>

    <script>
        const generateBtn = document.getElementById('generate-btn');
        const card = document.getElementById('pokemon-card');
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const pokemonImg = document.getElementById('pokemon-img');
        const pokemonId = document.getElementById('pokemon-id');
        const pokemonName = document.getElementById('pokemon-name');
        const pokemonTypes = document.getElementById('pokemon-types');
        const pokemonDetails = document.getElementById('pokemon-details');
        const pokemonStats = document.getElementById('pokemon-stats');

        const MAX_POKEMON_ID = 1025;

        function getRandomId() {
            return Math.floor(Math.random() * MAX_POKEMON_ID) + 1;
        }

        async function generatePokemon() {
            generateBtn.disabled = true;
            card.classList.remove('visible');
            errorEl.classList.remove('visible');
            loadingEl.classList.add('visible');

            try {
                const id = getRandomId();
                const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
                if (!res.ok) throw new Error('API-feil');
                const pokemon = await res.json();

                const sprite = pokemon.sprites.other['official-artwork'].front_default
                    || pokemon.sprites.front_default;

                pokemonImg.src = sprite;
                pokemonImg.alt = pokemon.name;
                pokemonId.textContent = `#${String(pokemon.id).padStart(3, '0')}`;
                pokemonName.textContent = pokemon.name;

                pokemonTypes.innerHTML = pokemon.types.map(t =>
                    `<span class="type-badge type-${t.type.name}">${t.type.name}</span>`
                ).join('');

                pokemonDetails.innerHTML = `
                    <span>Høyde: ${(pokemon.height / 10).toFixed(1)} m</span>
                    <span>Vekt: ${(pokemon.weight / 10).toFixed(1)} kg</span>
                `;

                pokemonStats.innerHTML = pokemon.stats.map(s => {
                    const pct = Math.min(100, (s.base_stat / 255) * 100);
                    return `
                        <div class="stat-row">
                            <span class="stat-name">${s.stat.name.replace('-', ' ')}</span>
                            <div class="stat-bar-bg">
                                <div class="stat-bar" style="width: ${pct}%"></div>
                            </div>
                            <span class="stat-value">${s.base_stat}</span>
                        </div>
                    `;
                }).join('');

                loadingEl.classList.remove('visible');
                card.classList.add('visible');
            } catch (err) {
                loadingEl.classList.remove('visible');
                errorEl.classList.add('visible');
            }

            generateBtn.disabled = false;
        }

        generateBtn.addEventListener('click', generatePokemon);
    </script>
</body>
</html>
