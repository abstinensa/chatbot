trigger:
  branches:
    include:
      - main

variables:
  acrName: '<din-acr>.azurecr.io'
  imageName: 'journal-qa'
  webAppName: '<din-app-service>'

stages:
  - stage: Build
    jobs:
      - job: BuildAndPush
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build and push image'
            inputs:
              containerRegistry: '<din-service-connection>'
              repository: $(imageName)
              command: buildAndPush
              Dockerfile: '**/Dockerfile'
              tags: |
                $(Build.BuildId)
                latest

  - stage: Deploy
    dependsOn: Build
    jobs:
      - job: DeployToAppService
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy to Azure App Service'
            inputs:
              azureSubscription: '<din-azure-subscription>'
              appName: $(webAppName)
              containers: '$(acrName)/$(imageName):$(Build.BuildId)'
